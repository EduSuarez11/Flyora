<header class="header">
  <a class="header__brand" href="#" aria-label="Flyora, inicio">
    <svg class="header__brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5L21 16z" />
    </svg>
    <span class="header__brand-text">
      <span class="header__brand-name">Flyora</span>
      <span class="header__brand-tagline">Vuela · Descubre · Explora</span>
    </span>
  </a>

  <div class="header__search">
    <svg class="header__search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
    <input
      class="header__search-input"
      type="search"
      placeholder="Busca destinos, vuelos, hoteles o actividades..."
      aria-label="Buscar"
    />
  </div>

  <div class="header__actions">
    <button class="header__icon-button header__notification" type="button" aria-label="Notificaciones">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
        <path d="M10 21h4" />
      </svg>
    </button>

    <button class="header__icon-button" type="button" aria-label="Favoritos">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0 0-7.8z" />
      </svg>
    </button>

    <div class="header__auth">
      <a role="button" class="header__auth-button header__auth-button--secondary" (click)="router.navigateByUrl('/auth/Login')">Iniciar sesión</a>
      <a role="button" class="header__auth-button header__auth-button--primary" (click)="router.navigateByUrl('/auth/Register')">Regístrate</a>
    </div>

    
    <!--
    <div class="header__profile">
      <span class="header__avatar">SC</span>
      <span class="header__profile-text">
        <span class="header__profile-name">Sophie Carter</span>
        <span class="header__profile-email">sophiecarter@gmail.com</span>
      </span>
      <svg class="header__chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </div>
    -->
  </div>
</header>
